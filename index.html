<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#B71C1C">
  <title>Lycée Maroc AI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ═══ Splash ═══ -->
  <div id="splash" class="splash">
    <div class="logo-circle"><span class="logo-icon">🌿</span></div>
    <h1 class="splash-title">Lycée Maroc AI</h1>
    <p class="splash-subtitle">الأستاذ المغربي الذكي</p>
    <div class="splash-line"></div>
  </div>

  <!-- ═══ Language ═══ -->
  <div id="langScreen" class="screen hidden">
    <h1>اختر اللغة</h1>
    <button class="lang-btn" data-lang="ar">🇲🇦 العربية</button>
    <button class="lang-btn" data-lang="fr">🇫🇷 Français</button>
    <button class="lang-btn" data-lang="en">🇬🇧 English</button>
  </div>

  <!-- ═══ Welcome ═══ -->
  <div id="welcomeScreen" class="screen hidden">
    <div class="logo-circle"><span class="logo-icon">🌿</span></div>
    <h1>Lycée Maroc AI</h1>
    <p>الأستاذ المغربي الذكي</p>
    <button id="goLogin" class="btn-primary">تسجيل الدخول</button>
    <button id="goSignup" class="btn-outline">إنشاء حساب جديد</button>
  </div>

  <!-- ═══ Auth ═══ -->
  <div id="authScreen" class="screen hidden">
    <button id="backBtn" class="back-btn">← رجوع</button>
    <h2 id="authTitle">إنشاء حساب جديد</h2>

    <form id="signupForm" class="auth-form" novalidate>
      <label class="label">اختر الدور</label>
      <div class="roles">
        <button type="button" class="role-btn" data-role="teacher">👨‍🏫 أستاذ</button>
        <button type="button" class="role-btn" data-role="student">🎓 تلميذ</button>
        <button type="button" class="role-btn" data-role="parent">👨‍👦 ولي أمر</button>
        <button type="button" class="role-btn" data-role="guard">🛡️ حارس</button>
        <button type="button" class="role-btn" data-role="director">🏛️ مدير</button>
      </div>

      <input type="text" id="suName" placeholder="الاسم الكامل" required minlength="3" maxlength="60" autocomplete="name">
      <input type="email" id="suEmail" placeholder="البريد الإلكتروني" required maxlength="100" autocomplete="email">
      <input type="tel" id="suPhone" placeholder="06XXXXXXXX" maxlength="10" inputmode="numeric" autocomplete="tel">
      <input type="password" id="suPassword" placeholder="كلمة المرور (8 أحرف على الأقل)" required minlength="8" maxlength="100" autocomplete="new-password">

      <!-- ═══ حقول الأستاذ ═══ -->
      <div id="teacherFields" class="hidden">
        <label class="label">📚 المادة</label>
        <select id="suSubject" class="select">
          <option value="">اختر المادة...</option>
          <option>اللغة العربية</option>
          <option>اللغة الفرنسية</option>
          <option>اللغة الإنجليزية</option>
          <option>الرياضيات</option>
          <option>الفيزياء والكيمياء</option>
          <option>علوم الحياة والأرض</option>
          <option>التاريخ والجغرافيا</option>
          <option>التربية الإسلامية</option>
          <option>الفلسفة</option>
          <option>الاقتصاد</option>
          <option>المحاسبة</option>
          <option>القانون</option>
          <option>المعلوميات</option>
          <option>الهندسة الكهربائية</option>
          <option>الهندسة الميكانيكية</option>
          <option>التربية البدنية</option>
        </select>

        <label class="label">🎓 المستوى</label>
        <select id="suLevel" class="select">
          <option value="">اختر المستوى...</option>
          <option>السابعة</option>
          <option>الثامنة</option>
          <option>التاسعة</option>
          <option>الجذع المشترك</option>
          <option>الأولى باك</option>
          <option>الثانية باك</option>
        </select>

        <label class="label">🏫 المؤسسة</label>
        <input type="text" id="suSchool" placeholder="اسم الثانوية / الإعدادية" minlength="3" maxlength="100">
      </div>

      <!-- ═══ حقول التلميذ ═══ -->
      <div id="studentFields" class="hidden">
        <label class="label">📱 رقم هاتف الوالد</label>
        <input type="tel" id="suParentPhone" placeholder="06XXXXXXXX" maxlength="10" inputmode="numeric">

        <label class="label">🎓 المستوى</label>
        <select id="suStudentLevel" class="select">
          <option value="">اختر المستوى...</option>
          <option>السابعة</option>
          <option>الثامنة</option>
          <option>التاسعة</option>
          <option>الجذع المشترك</option>
          <option>الأولى باك</option>
          <option>الثانية باك</option>
        </select>

        <label class="label">🏫 المؤسسة</label>
        <input type="text" id="suStudentInstitution" placeholder="اسم الثانوية / الإعدادية" minlength="3" maxlength="100">
      </div>

      <button type="submit" class="btn-primary" id="signupBtn" disabled>إنشاء حسابي</button>
    </form>

    <form id="loginForm" class="auth-form hidden">
      <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" required maxlength="100" autocomplete="email">
      <input type="password" id="loginPassword" placeholder="كلمة المرور" required maxlength="100" autocomplete="current-password">
      <button type="submit" class="btn-primary">دخول</button>
    </form>

    <p id="errorMsg" class="error hidden"></p>
    <p id="successMsg" class="success hidden"></p>
  </div>

  <!-- ═══ Code Reveal ═══ -->
  <div id="codeRevealScreen" class="screen hidden">
    <div class="logo-circle"><span class="logo-icon">🎟️</span></div>
    <h2>مرحباً بك!</h2>
    <p>هادا هو كود المشاركة ديالك:</p>

    <div class="code-box">
      <div class="code-text" id="revealCode">------</div>
      <p class="code-hint">عطي هاد الكود للتلاميذ باش ينضمو ليك</p>
    </div>

    <button id="copyRevealBtn" class="btn-primary">📋 نسخ الكود</button>
    <button id="continueBtn" class="btn-outline">✅ متابعة للوحة التحكم</button>
  </div>

  <!-- ═══ Dashboard ═══ -->
  <div id="dashboardScreen" class="screen hidden">
    <div class="dash-header">
      <div>
        <h1 id="dashGreeting">مرحباً</h1>
        <p id="dashRole" class="role-badge"></p>
      </div>
      <div class="header-actions">
        <button id="settingsBtn" class="btn-icon">⚙️</button>
        <button id="logoutBtn" class="btn-icon">🚪</button>
      </div>
    </div>
    <div id="dashContent"></div>

    <!-- 🔽 مخفي — للتوافق مع app.js القديم 🔽 -->
    <p id="userInfo" class="hidden"></p>
  </div>

  <!-- ═══ 🎬 Netflix Style — الحساب غير نشط ═══ -->
  <div id="accountInactiveScreen" class="screen hidden">
    <div class="logo-circle"><span class="logo-icon">⏸️</span></div>
    <h2>الحساب غير نشط</h2>
    <p>للحصول على المساعدة، تواصل مع الدعم</p>

    <a href="mailto:chouaibchailia@gmail.com" class="btn-primary">📧 إيميل</a>
    <a href="https://lycee-maroc-ai.vercel.app" target="_blank" class="btn-outline">🌐 الموقع</a>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
