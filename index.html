<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#B71C1C">
  <title>Lycée Maroc AI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="IMG_20261017_011706.jpg">
  <link rel="apple-touch-icon" href="IMG_20261017_011706.jpg">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div id="splash" class="splash">
    <div class="splash-logo-wrapper">
      <img src="IMG_20261017_011706.jpg" alt="Lycée Maroc AI" class="splash-logo">
    </div>
    <h1 class="splash-title">Lycée Maroc AI</h1>
    <p class="splash-subtitle">الأستاذ المغربي الذكي</p>
    <div class="splash-line"></div>
  </div>

  <div id="langScreen" class="screen hidden">
    <div class="lang-content">
      <h1 class="lang-title">اختر اللغة</h1>
      <p class="lang-subtitle">Choose your language</p>
      <div class="lang-options">
        <button class="lang-btn" data-lang="ar">
          <span class="lang-flag">🇲🇦</span>
          <span class="lang-name">العربية</span>
        </button>
        <button class="lang-btn" data-lang="fr">
          <span class="lang-flag">🇫🇷</span>
          <span class="lang-name">Français</span>
        </button>
        <button class="lang-btn" data-lang="en">
          <span class="lang-flag">🇬🇧</span>
          <span class="lang-name">English</span>
        </button>
      </div>
    </div>
  </div>

  <div id="welcomeScreen" class="screen hidden">
    <div class="welcome-logo-wrapper">
      <img src="IMG_20261017_011706.jpg" alt="Lycée Maroc AI" class="welcome-logo">
    </div>
    <h1 class="welcome-title">Lycée Maroc AI</h1>
    <p class="welcome-subtitle">الأستاذ المغربي الذكي</p>
    <div class="welcome-buttons">
      <button id="goLogin" class="btn-primary">تسجيل الدخول</button>
      <button id="goSignup" class="btn-outline">إنشاء حساب جديد</button>
    </div>
  </div>

  <div id="authScreen" class="screen hidden">
    <button id="backBtn" class="back-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      <span>رجوع</span>
    </button>
    <h2 id="authTitle" class="auth-title">إنشاء حساب جديد</h2>

    <form id="signupForm" class="auth-form" novalidate>
      <label class="label">اختر الدور</label>
      <div class="roles">
        <button type="button" class="role-btn" data-role="teacher">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
          <span>أستاذ</span>
        </button>
        <button type="button" class="role-btn" data-role="student">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          <span>تلميذ</span>
        </button>
        <button type="button" class="role-btn" data-role="parent">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          <span>ولي أمر</span>
        </button>
        <button type="button" class="role-btn" data-role="guard">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
          <span>حارس</span>
        </button>
        <button type="button" class="role-btn" data-role="director">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 22v-4a2 2 0 1 0-4 0v4"/><path d="m18 10 3.447 1.724a1 1 0 0 1 .553.894V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-7.382a1 1 0 0 1 .553-.894L6 10"/><path d="M18 5v17"/><path d="m4 6 8-4 8 4"/><path d="M6 5v17"/><circle cx="12" cy="9" r="2"/></svg>
          <span>مدير</span>
        </button>
      </div>

      <div class="input-wrapper">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="suName" placeholder="الاسم الكامل" required minlength="3" maxlength="60" autocomplete="name">
      </div>

      <div class="input-wrapper">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        <input type="email" id="suEmail" placeholder="البريد الإلكتروني" required maxlength="100" autocomplete="email">
      </div>

      <div class="input-wrapper">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
        <input type="tel" id="suPhone" placeholder="06XXXXXXXX" maxlength="10" inputmode="numeric" autocomplete="tel">
      </div>

      <div class="input-wrapper">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="suPassword" placeholder="كلمة المرور (8 أحرف على الأقل)" required minlength="8" maxlength="100" autocomplete="new-password">
      </div>

      <div id="teacherFields" class="hidden">
        <label class="label">المادة</label>
        <select id="suSubject" class="select">
          <option value="">اختر المادة...</option>
          <option>اللغة العربية</option>
          <option>اللغة الفرنسية</option>
          <option>اللغة الإنجليزية</option>
          <option>الرياضيات</option>
          <option>الفيزياء والكيمياء</option>
          <option>علوم الحياة والأرض</option>
          <option>التاريخ والجغرافيا</option>
          <option>التربية الإسلامية</option>
          <option>الفلسفة</option>
          <option>الاقتصاد</option>
          <option>المحاسبة</option>
          <option>القانون</option>
          <option>المعلوميات</option>
          <option>الهندسة الكهربائية</option>
          <option>الهندسة الميكانيكية</option>
          <option>التربية البدنية</option>
        </select>

        <label class="label">المستوى</label>
        <select id="suLevel" class="select">
          <option value="">اختر المستوى...</option>
          <option>السابعة</option>
          <option>الثامنة</option>
          <option>التاسعة</option>
          <option>الجذع المشترك</option>
          <option>الأولى باك</option>
          <option>الثانية باك</option>
        </select>

        <label class="label">المؤسسة</label>
        <input type="text" id="suSchool" placeholder="اسم الثانوية / الإعدادية" minlength="3" maxlength="100">
      </div>

      <div id="studentFields" class="hidden">
        <label class="label">رقم هاتف الوالد</label>
        <input type="tel" id="suParentPhone" placeholder="06XXXXXXXX" maxlength="10" inputmode="numeric">

        <label class="label">المستوى</label>
        <select id="suStudentLevel" class="select">
          <option value="">اختر المستوى...</option>
          <option>السابعة</option>
          <option>الثامنة</option>
          <option>التاسعة</option>
          <option>الجذع المشترك</option>
          <option>الأولى باك</option>
          <option>الثانية باك</option>
        </select>

        <label class="label">المؤسسة</label>
        <input type="text" id="suStudentInstitution" placeholder="اسم الثانوية / الإعدادية" minlength="3" maxlength="100">
      </div>

      <button type="submit" class="btn-primary" id="signupBtn" disabled>إنشاء حسابي</button>
    </form>

    <form id="loginForm" class="auth-form hidden">
      <div class="input-wrapper">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" required maxlength="100" autocomplete="email">
      </div>
      <div class="input-wrapper">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="loginPassword" placeholder="كلمة المرور" required maxlength="100" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">دخول</button>
    </form>

    <p id="errorMsg" class="error hidden"></p>
    <p id="successMsg" class="success hidden"></p>
  </div>

  <div id="codeRevealScreen" class="screen hidden">
    <div class="code-reveal-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>
    </div>
    <h2>مرحباً بك!</h2>
    <p class="code-reveal-subtitle">هادا هو كود المشاركة ديالك:</p>

    <div class="code-box">
      <div class="code-text" id="revealCode">------</div>
      <p class="code-hint">عطي هاد الكود للتلاميذ باش ينضمو ليك</p>
    </div>

    <button id="copyRevealBtn" class="btn-primary">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      <span>نسخ الكود</span>
    </button>
    <button id="continueBtn" class="btn-outline">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      <span>متابعة للوحة التحكم</span>
    </button>
  </div>

  <div id="dashboardScreen" class="screen hidden">
    <div class="dash-header">
      <div class="dash-header-info">
        <h1 id="dashGreeting">مرحباً</h1>
        <p id="dashRole" class="role-badge"></p>
      </div>
      <div class="header-actions">
        <button id="settingsBtn" class="btn-icon" aria-label="الإعدادات">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button id="logoutBtn" class="btn-icon" aria-label="خروج">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
    <div id="dashContent"></div>

    <p id="userInfo" class="hidden"></p>
  </div>

  <div id="accountInactiveScreen" class="screen hidden">
    <div class="inactive-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="10" y1="15" x2="10" y2="9"/><line x1="14" y1="15" x2="14" y2="9"/></svg>
    </div>
    <h2>الحساب غير نشط</h2>
    <p>للحصول على المساعدة، تواصل مع الدعم</p>

    <a href="mailto:chouaibchailia@gmail.com" class="btn-primary">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      <span>إيميل</span>
    </a>
    <a href="https://lycee-maroc-ai.vercel.app" target="_blank" class="btn-outline">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      <span>الموقع</span>
    </a>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
